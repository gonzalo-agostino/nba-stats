[project]
name = "nba-stats"
version = "0.1.0"
description = "NBA player stats prediction with dynamic scenarios (injuries, suspensions, B2B, WOWY) using LightGBM and LangGraph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.165.0",
    "langchain-google-vertexai>=3.3.0",
    "langgraph>=1.2.24",
    "langsmith>=0.16.2",
    "lightgbm>=4.7.0",
    "nba-api>=1.5.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "rich>=13.9.0",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "tenacity>=9.0.0",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[project.scripts]
nba-stats = "nba_stats.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
