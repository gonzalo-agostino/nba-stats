# Two-stage LightGBM training & temporal backtesting config (Full 13 stats)
stage1_target: "min"
stage2_targets:
  - "pts"
  - "reb"
  - "ast"
  - "stl"
  - "blk"
  - "tov"
  - "pf"
  - "fga"
  - "ftm"

derived_targets:
  pra:
    - "pts"
    - "reb"
    - "ast"
  pr:
    - "pts"
    - "reb"
  pa:
    - "pts"
    - "ast"

# Poisson objective prevents low-count discrete stats (BLK/STL/PF/TOV) from collapsing to median 0
# FTM uses regression_l1 to directly optimize MAE without zero-inflation collapse
target_objectives:
  stl: "poisson"
  blk: "poisson"
  tov: "poisson"
  pf: "poisson"

validation:
  n_splits: 5
  min_train_fraction: 0.45
  min_prior_games: 5

lightgbm:
  objective: "regression_l1"
  metric: "mae"
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 40
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_alpha: 0.5
  reg_lambda: 1.0
  n_estimators: 800
  early_stopping_rounds: 50
  random_state: 42
  n_jobs: -1
  verbose: -1
